<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlavorHub — Create Account</title>
  <meta name="description" content="Join FlavorHub and enjoy restaurant-quality food delivered to your doorstep.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page-body">

  <div class="auth-bg-blob blob-1"></div>
  <div class="auth-bg-blob blob-2"></div>

  <div class="toast-container" id="toastContainer"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html"><i class="bi bi-egg-fried"></i> FlavorHub</a>
    </div>

    <h2>Create Account</h2>
    <p class="auth-subtitle">Join thousands of food lovers. Sign up for free!</p>

    <form id="registerForm" novalidate>
      <div class="auth-group">
        <label class="auth-form-label" for="regName">Full Name</label>
        <input type="text" id="regName" class="auth-form-input" placeholder="John Doe" required>
      </div>

      <div class="auth-group">
        <label class="auth-form-label" for="regEmail">Email Address</label>
        <input type="email" id="regEmail" class="auth-form-input" placeholder="you@example.com" required>
      </div>

      <div class="auth-group">
        <label class="auth-form-label" for="regPhone">Phone Number</label>
        <input type="tel" id="regPhone" class="auth-form-input" placeholder="+1 (234) 567-8900">
      </div>

      <div class="auth-group">
        <label class="auth-form-label" for="regAddress">Delivery Address <span style="opacity: 0.5;">(optional)</span></label>
        <input type="text" id="regAddress" class="auth-form-input" placeholder="123 Main St, City">
      </div>

      <div class="auth-group">
        <label class="auth-form-label" for="regPassword">Password</label>
        <input type="password" id="regPassword" class="auth-form-input" placeholder="Min. 6 characters" required>
      </div>

      <div class="auth-group" style="margin-bottom: 1.75rem;">
        <label class="auth-form-label" for="regConfirmPassword">Confirm Password</label>
        <input type="password" id="regConfirmPassword" class="auth-form-input" placeholder="Repeat password" required>
      </div>

      <button type="submit" class="btn-auth-submit">Create Account</button>
    </form>

    <div class="auth-divider">or continue with</div>
    <div class="social-login-btns">
      <button class="btn-social google"><i class="fab fa-google"></i> Google</button>
      <button class="btn-social facebook"><i class="fab fa-facebook-f"></i> Facebook</button>
    </div>

    <p class="auth-switch-link">Already have an account? <a href="login.html">Sign in →</a></p>
  </div>

  <script src="js/api.js?v=999"></script>
  <script src="js/global.js?v=999"></script>
  <script src="js/register.js?v=999"></script>
</body>
</html>
