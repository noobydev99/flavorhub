<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlavorHub — Sign In</title>
  <meta name="description" content="Sign in to your FlavorHub account to manage your orders and preferences.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page-body">

  <!-- Background blobs -->
  <div class="auth-bg-blob blob-1"></div>
  <div class="auth-bg-blob blob-2"></div>

  <!-- Global Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <a href="index.html"><i class="bi bi-egg-fried"></i> FlavorHub</a>
    </div>

    <h2>Welcome Back</h2>
    <p class="auth-subtitle">Sign in to your account to continue your flavor journey.</p>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="auth-group">
        <label class="auth-form-label" for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" class="auth-form-input" placeholder="you@example.com" required>
      </div>

      <div class="auth-group">
        <label class="auth-form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="auth-form-input" placeholder="Your password" required>
      </div>

      <div class="auth-form-row">
        <label class="auth-remember-me">
          <input type="checkbox" id="rememberMe">
          Remember me
        </label>
        <a href="#" class="auth-forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-auth-submit">Sign In</button>
    </form>

    <div class="auth-divider">or continue with</div>
    <div class="social-login-btns">
      <button class="btn-social google"><i class="fab fa-google"></i> Google</button>
      <button class="btn-social facebook"><i class="fab fa-facebook-f"></i> Facebook</button>
    </div>

    <p class="auth-switch-link">Don't have an account? <a href="register.html">Create one now →</a></p>
  </div>

  <script src="js/api.js?v=999"></script>
  <script src="js/global.js?v=999"></script>
  <script src="js/login.js?v=999"></script>
</body>
</html>
